<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Workers">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Workers" />
  <meta property="og:description" content="Built with FlutterFlow." />
  <meta property="og:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" /> 
  <meta name="twitter:title" content="Workers" />
  <meta name="twitter:description" content="Built with FlutterFlow." />
  <meta name="twitter:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> Workers </title>
  <meta name="description" content="Built with FlutterFlow." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1d2428">

  <link rel="manifest" href="manifest.json">
  
</head>
<body>
  
  <script>
    // Dynamically fetch and inject Google Maps API key
    async function loadGoogleMaps() {
      let apiKey = null;
      
      try {
        // Attempt to fetch from local or prod backend depending on host
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const baseUrl = isLocal ? 'http://localhost:8000/api/mob' : 'https://api.serviceprohob.com/api/mob';
        
        const response = await fetch(`${baseUrl}/public/settings`);
        if (response.ok) {
          const res = await response.json();
          if (res && res.data && res.data.google_maps_api_key) {
            apiKey = res.data.google_maps_api_key.trim();
          }
        }
      } catch (error) {
        console.warn('Could not fetch dynamic maps API key (likely not logged in or missing). Loading maps without key to prevent startup crash.');
      }
      
      return new Promise((resolve) => {
        const script = document.createElement('script');
        script.onload = resolve;
        script.onerror = resolve; // Resolve even on error so app doesn't hang forever
        
        // If apiKey is null/empty, Google Maps SDK will still load but will show an "API Key missing" 
        // watermark on the map instead of crashing the entire Flutter app!
        const keyParam = apiKey ? `?key=${apiKey}` : '';
        script.src = `https://maps.googleapis.com/maps/api/js${keyParam}`;
        
        document.head.appendChild(script);
      });
    }

    async function startApp() {
      await loadGoogleMaps();
      
      // Now that Google Maps is loaded, we can safely execute Flutter's bootstrap
      const bootstrapCode = document.getElementById('flutter-bootstrap').textContent;
      const flutterScript = document.createElement('script');
      flutterScript.text = bootstrapCode;
      document.body.appendChild(flutterScript);
    }
    
    startApp();
  </script>
  
  <script id="flutter-bootstrap" type="text/plain">
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
