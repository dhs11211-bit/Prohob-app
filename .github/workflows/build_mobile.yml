name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ "version1_final", "phase_30_build_error_fixed3", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS (No Codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          set +e
          flutter build ios --release --no-codesign -v > ios_build.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error title=Build Failed::iOS build exited with code $BUILD_EXIT"
            grep -B 2 -A 35 -E "Exception|Oops|FormatException|StateError|Unhandled" ios_build.log | head -n 40 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Exception::$line"
            done
            tail -n 60 ios_build.log | head -n 30 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Trace::$line"
            done
            exit $BUILD_EXIT
          fi

      - name: Upload iOS Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios_build.log
          if-no-files-found: warn

      - name: Package iOS App and IPA
        run: |
          cd build/ios/iphoneos
          zip -r ../../../Runner.app.zip Runner.app
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Runner.ipa Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runner-ios-build
          path: |
            Runner.app.zip
            Runner.ipa
          if-no-files-found: warn

